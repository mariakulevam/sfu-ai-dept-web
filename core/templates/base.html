{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block meta_description %}Кафедра «Системы искусственного интеллекта» Института космических и информационных технологий СФУ.{% endblock %}">

    <title>{% block title %}Главная{% endblock %} — Кафедра СИИ • ИКИТ • СФУ</title>

    <link rel="icon" type="image/svg+xml" href="{% static 'img/ikit/sign-color.svg' %}">

    <link rel="stylesheet" href="{% static 'css/tokens.css' %}">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
    <link rel="stylesheet" href="{% static 'css/components.css' %}">
    <link rel="stylesheet" href="{% static 'css/layout.css' %}">
    <link rel="stylesheet" href="{% static 'css/pages.css' %}">

    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="page-shell">
    {% include 'includes/header.html' %}

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    {% include 'includes/footer.html' %}
</div>

<script src="{% static 'js/app.js' %}" defer></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
